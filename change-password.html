<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SR Chits ERP - Change Password</title>

<link
rel="stylesheet"
href="css/change-password.css">

</head>

<body>

<div class="change-password-container">

    <div class="change-password-card">

        <div class="logo">

            <h1>SR Chits ERP</h1>

            <p>Member Self Service Portal</p>

        </div>

        <h2 class="page-title">

            Change Password

        </h2>

        <p class="page-subtitle">

            For your account security, please change your default password.

        </p>

        <div class="input-group">

            <label>Current Password</label>

            <input
            type="password"
            id="currentPassword"
            placeholder="Enter Current Password"
            autocomplete="current-password">

        </div>

        <div class="input-group">

            <label>New Password</label>

            <input
            type="password"
            id="newPassword"
            placeholder="Enter New Password"
            autocomplete="new-password">

        </div>

        <div class="input-group">

            <label>Confirm Password</label>

            <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
            autocomplete="new-password">

        </div>

        <button
        id="updatePasswordBtn"
        class="update-btn">

            Update Password

        </button>

        <div class="footer">

            Password must contain at least 6 characters.

            <div class="version">

                Powered by<br>
                VTOOS Software Solutions<br>
                Version 1.0.0

            </div>

        </div>

    </div>

</div>

<script
type="module"
src="js/change-password.js">
</script>

</body>

</html>
