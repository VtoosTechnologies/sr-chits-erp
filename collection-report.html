<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Collection Report</title>

<link rel="stylesheet" href="css/collection-report.css">

</head>

<body>

<div class="container">

<h2>📊 Collection Report</h2>

<!--=================================
Summary Cards
==================================-->

<div class="summary">

<div class="summary-card">
<h4>Total Pending Amount</h4>
<h2 id="totalPending">₹0</h2>
</div>

<div class="summary-card">
<h4>Total Advance (Loan)</h4>
<h2 id="totalAdvance">₹0</h2>
</div>

<div class="summary-card">
<h4>Pending Members</h4>
<h2 id="pendingMembers">0</h2>
</div>

<div class="summary-card">
<h4>Completed Members</h4>
<h2 id="completedMembers">0</h2>
</div>

</div>

<!--=================================
Filters
==================================-->

<div class="card">

<div class="row">

<div class="form-group">
<label>Status</label>
<select id="statusFilter">
<option value="ALL">All</option>
<option value="PENDING">Pending</option>
<option value="COMPLETED">Completed</option>
</select>
</div>

<div class="form-group">
<label>Search</label>
<input
type="text"
id="searchInput"
placeholder="Customer ID / Member Name / Mobile">
</div>

</div>

<div class="button-area">

<button id="searchReport">
🔍 Search
</button>

<button id="exportExcel">
📊 Excel
</button>

<button id="printReport">
🖨 Print
</button>

</div>

</div>

<!--=================================
Collection Report Table
==================================-->

<div class="table-container">

<table>

<thead>

<tr>

<th>Customer ID</th>

<th>Member Name</th>

<th>Groups</th>

<th>Pending Amount</th>

<th>Advance (Loan)</th>

</tr>

</thead>

<tbody id="reportBody">

<tr>

<td colspan="5">

No Records Found

</td>

</tr>

</tbody>

<tfoot>

<tr>

<th colspan="2">
Total Members :
<span id="totalMembers">0</span>
</th>

<th id="totalGroups">0</th>

<th id="footerPending">
₹0
</th>

<th id="footerAdvance">
₹0
</th>

</tr>

</tfoot>

</table>

</div>

</div>

<script
type="module"
src="js/collection-report.js">
</script>

</body>

</html>
