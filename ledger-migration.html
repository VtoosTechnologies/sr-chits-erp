<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ledger Migration</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container">

<h2>
🛠 Member Ledger Repair Tool
</h2>

<div class="card">

<p>
This utility will repair existing Member Ledger records by updating Member ID and Reference Number.
</p>

<p>
Run this only once to repair old ledger records.
</p>

<button
id="startMigration"
class="btn btn-primary">

Start Migration

</button>

</div>

<div class="card">

<h3>Migration Status</h3>

<p>
Total Records :
<span id="totalRecords">0</span>
</p>

<p>
Migrated :
<span id="migratedRecords">0</span>
</p>

<p>
Skipped :
<span id="skippedRecords">0</span>
</p>

<p>
Status :
<span id="migrationStatus">

Waiting...

</span>
</p>

</div>

<div
style="margin-top:20px;">

<a
href="dashboard.html"
class="btn">

⬅ Back

</a>

</div>

</div>

<script
type="module"
src="js/ledger-migration.js">

</script>

</body>

</html>
