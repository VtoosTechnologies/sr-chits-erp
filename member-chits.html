<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Chits | SR Chits ERP</title>

    <link rel="stylesheet"
          href="css/member-chits.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- Header -->

    <header class="header">

        <button id="backBtn"
                class="back-btn">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h2>My Chits</h2>

    </header>

    <!-- Main Container -->

    <div class="container">

        <!-- Member Summary -->

        <div class="member-summary">

            <h2 id="memberName">
                Loading...
            </h2>

            <p>

                Customer ID :
                <span id="referenceNo">-</span>

            </p>

            <p>

                Total Active Chits :
                <span id="totalGroups">0</span>

            </p>

        </div>

        <!-- All Chit Cards -->

        <div id="chitContainer">

        </div>
                <!-- End of Dynamic Chit Cards -->

    </div>

    <!-- Footer -->

    <footer>

        <p>

            Powered by
            <strong>VTOOS Software Solutions</strong>

        </p>

        <small>

            Version 2.0.0

        </small>

    </footer>

    <!-- JavaScript -->

    <script type="module"
            src="js/member-chits.js"></script>

</body>

</html>
