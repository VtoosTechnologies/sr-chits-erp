<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>SR Chits ERP</h1>
            <p>Member Self Service Portal</p>
        </div>

        <h2 class="login-title">
            Member Login
        </h2>

        <p class="login-subtitle">
            View your chit details and payment history.
        </p>

        <div class="input-group">
           <label>User ID</label>

<input
type="text"
id="userId"
placeholder="Enter User ID (Example: SR000001)">
            autocomplete="username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter Password">
            autocomplete="current-password">
        </div>

        <button
            id="loginBtn"
            class="login-btn">
            Login
        </button>

        <div class="footer">

            Need Help?<br>
            Please contact your Chit Office

            <div class="version">
                Powered by<br>
                VTOOS Software Solutions<br>
                Version 1.0.0
            </div>

        </div>

    </div>

</div>

<script
type="module"
src="js/member-login.js">
</script>

</body>
