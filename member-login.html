<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>SR Chits ERP</h1>
            <p>Member Self Service Portal</p>
        </div>

        <h2 class="login-title">
            Secure Member Login
        </h2>

        <p class="login-subtitle">
            Access your Chit Account securely
        </p>

        <div class="input-group">
            <label>Member Code</label>
            <input
                type="text"
                id="memberCode"
                placeholder="Enter Member Code">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter Password">
        </div>

        <button
            id="loginBtn"
            class="login-btn">
            Login
        </button>

        <div class="footer">

            Need Help?<br>
            Contact your Chit Office

            <div class="version">
                Powered by<br>
                VTOOS Software Solutions<br>
                Version 2.0
            </div>

        </div>

    </div>

</div>

<script
type="module"
src="js/member-login.js">
</script>

</body>
