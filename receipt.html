<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receipt History</title>

<link rel="stylesheet" href="css/receipt.css">

</head>

<body>

<div class="container">

    <h1>📄 Receipt History</h1>

    <!-- Tabs -->

    <div class="tabs">

        <button
            id="collectionTab"
            class="active">

            💰 Collection Receipts

        </button>

        <button
            id="auctionTab">

            🏆 Auction Receipts

        </button>

    </div>

    <!-- Filters -->

    <div class="filters">

        <div>

            <label>From Date</label>

            <input
                type="date"
                id="fromDate">

        </div>

        <div>

            <label>To Date</label>

            <input
                type="date"
                id="toDate">

        </div>

        <button
            id="searchBtn">

            🔍 Search

        </button>

    </div>

    <!-- Table -->

    <div class="table-area">

        <table>

            <thead>

                <tr>

                    <th>Receipt No</th>

                    <th>Date</th>

                    <th>Name</th>

                    <th>Amount</th>

                    <th>View</th>

                </tr>

            </thead>

            <tbody id="receiptTable">

                <tr>

                    <td colspan="5">

                        No Records Found

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- Footer -->

    <div class="footer">

        Total Receipts :
        <span id="totalReceipts">

            0

        </span>

    </div>

</div>

<script type="module" src="js/receipt.js"></script>

</body>

</html>
