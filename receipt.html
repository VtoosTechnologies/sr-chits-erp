<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Collection Receipt</title>

<link rel="stylesheet" href="receipt.css">

</head>

<body>

<div class="receipt-container">

    <h1>VTOOS SOFTWARE SOLUTIONS</h1>

    <h2>SR CHITS ERP</h2>

    <h3>COLLECTION RECEIPT</h3>

    <hr>

    <table>

        <tr>
            <td>Receipt No</td>
            <td id="receiptNo">-</td>
        </tr>

        <tr>
            <td>Transaction No</td>
            <td id="transactionNo">-</td>
        </tr>

        <tr>
            <td>Reference No</td>
            <td id="referenceNo">-</td>
        </tr>

        <tr>
            <td>Member Name</td>
            <td id="memberName">-</td>
        </tr>

        <tr>
            <td>Group Name</td>
            <td id="groupName">-</td>
        </tr>

        <tr>
            <td>Installment</td>
            <td id="installmentNo">-</td>
        </tr>

        <tr>
            <td>Payment Mode</td>
            <td id="paymentMode">-</td>
        </tr>

        <tr>
            <td>Collected Amount</td>
            <td id="receivedAmount">₹0</td>
        </tr>

        <tr>
            <td>Remarks</td>
            <td id="remarks">-</td>
        </tr>

        <tr>
            <td>Date</td>
            <td id="collectionDate">-</td>
        </tr>

    </table>

    <hr>

    <p class="thanks">
        Thank You! Visit Again.
    </p>

    <div class="buttons">

        <button id="printReceipt">
            Print
        </button>

        <button id="shareReceipt">
            Share
        </button>

    </div>

</div>

<script type="module" src="receipt.js"></script>

</body>
</html>
